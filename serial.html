<html><head><title>C3 Bridge</title><meta name='viewport' content='width=device-width, initial-scale=1'>
<script>
function upLog() {
  const b = document.getElementById('lb');
  const s = b.scrollHeight - b.clientHeight <= b.scrollTop + 50;
  fetch('/getlog')
    .then(r => r.text())
    .then(d => {
      b.innerHTML = d;
      if (s) b.scrollTop = b.scrollHeight;
    });
}
setInterval(upLog, 1200);
</script>
